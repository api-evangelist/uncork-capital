aid: uncork-capital
name: Uncork Capital
description: >-
  Uncork Capital is a San Francisco-based seed-stage venture capital firm founded
  in 2004 by Jeff Clavier, who formalized his angel portfolio into one of Silicon
  Valley's earliest dedicated seed funds; it operated as SoftTech VC until
  rebranding to Uncork Capital in 2017. Led by managing partners Jeff Clavier and
  Andy McLoughlin, the firm invests at the seed stage with a "first to believe"
  conviction style, typically targeting 10-15% ownership and writing seed checks
  broadly in the $1.5M-$4M range across B2B applications and SaaS, developer
  tooling, infrastructure and security, consumer and marketplaces, frontier
  tech/hardware, and AI/ML. In May 2025 the firm closed $300M in fresh capital
  across Uncork VIII (a $225M seed fund) and Uncork Plus IV (a $75M growth fund),
  bringing it to roughly $1.2B in assets under management. Across 275+ investments
  and 100+ outcomes, its portfolio and exits include SendGrid, Fitbit, Poshmark,
  Postmates, Eventbrite, LaunchDarkly, Tailscale, Front, Shippo, ClassDojo, Groq,
  Human Interest, Carrot Fertility, and GPTZero.
